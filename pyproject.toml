[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-lattice-lpm"
version = "0.1.0"
description = "Small-strain ghost-lattice coupling for polycrystal plasticity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "matplotlib>=3.8,<4", "pyamg>=5,<6"]

[project.optional-dependencies]
cuda = ["torch>=2.4"]
mesh = ["triangle>=20230923"]
experiment = ["openpyxl>=3.1,<4"]

[project.scripts]
ghost-lattice = "ghost_lattice.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
